/* v4.4 32-bit-era sprite/detail pass */
.portrait{width:112px;height:136px;border-width:3px;border-radius:9px;background:radial-gradient(circle at 50% 38%,#263442,#0b1015 70%);box-shadow:inset 0 0 18px #000,0 3px 8px #0008;overflow:hidden}
.heroPix,.enemyPix{transform:scale(1.18);transform-origin:50% 58%;filter:drop-shadow(0 4px 2px #0008)}
.heroPix .face{background:linear-gradient(90deg,#b97955 0 20%,#d89a70 20% 72%,#9c6045 72%);box-shadow:0 4px #70412f,inset 0 -4px #ad6e50}
.heroPix .hair{background:linear-gradient(#30241d,#59402d);box-shadow:-6px 7px #3d2d23,6px 7px #3d2d23,0 -4px #211a16}
.heroPix .body{background:linear-gradient(90deg,#34414c,#788996 42%,#53616d 68%,#2c363e);box-shadow:inset 0 7px #aab5bd,0 4px #20272d}
.heroPix .pauldron{background:linear-gradient(#d2d7da,#68747d 48%,#343d44);box-shadow:34px 1px #68747d,inset 0 3px #fff8}
.heroPix .sword{background:linear-gradient(90deg,#7d8992,#f3f5f5 38%,#aeb8be 70%,#66727a);box-shadow:0 -8px #eef2f4,3px 0 #59636a,-3px 0 #fafafa}
.heroPix:before{content:"";position:absolute;z-index:5;left:28px;top:28px;width:5px;height:3px;background:#201c19;box-shadow:12px 0 #201c19,2px 9px #8d493e,8px 9px #8d493e}
.enemyPix .face{background:linear-gradient(90deg,#754933,#a76d4e 45%,#71432f);box-shadow:inset 0 -4px #643b2b}
.enemyPix .body{background:linear-gradient(90deg,#3c3029,#805d47,#4c382e);box-shadow:inset 0 6px #a47759,0 4px #1b1715}
.enemyPix.bounty .body{background:linear-gradient(90deg,#3e2827,#9b514b,#4b2929)}
.enemyPix.boss{filter:drop-shadow(0 4px 2px #000) drop-shadow(0 0 6px #9e633b)}
.portrait:after{background:linear-gradient(90deg,#ffffff06 1px,transparent 1px),linear-gradient(#ffffff04 1px,transparent 1px);background-size:3px 3px}

/* 32-bit equipment cards */
.gear-icon{width:54px;height:54px;border:2px solid #59616a;border-radius:7px;background:radial-gradient(circle at 35% 30%,#34414b,#11171c 70%);box-shadow:inset 0 0 8px #000,0 2px 5px #0008}
.gear-icon:before,.gear-icon:after{filter:drop-shadow(1px 2px 1px #000)}
.gear-icon.Weapon:before{background:linear-gradient(90deg,#66727c,#f0f2ef 42%,#929ca3 65%,#4d565d)}
.gear-icon.Helm:before{background:linear-gradient(#c1c6c8,#747e84 48%,#3e474c)}
.gear-icon.Chest:before{background:linear-gradient(90deg,#48545c,#9aa4a9 45%,#505b62)}
.gear-icon.Gloves:before{background:linear-gradient(#9a7658,#5b4030)}
.gear-icon.Boots:before{background:linear-gradient(#85644b,#493529)}

/* richer pets */
.pet-sprite{width:70px;height:62px;border:2px solid #4f5c63;border-radius:8px;background:radial-gradient(circle at 45% 40%,#26323a,#0e1418 72%);box-shadow:inset 0 0 10px #000,0 2px 5px #0008}
.pet-sprite .body{background:linear-gradient(90deg,#624733,#a47a59 45%,#674a36);box-shadow:inset 0 5px #c0946e,5px 10px #49362b}
.pet-sprite .head{background:linear-gradient(90deg,#725039,#ae7e5b 55%,#644431);box-shadow:inset -4px -3px #593c2c}
.pet-sprite .eye{width:4px;height:4px;background:#f3d879;box-shadow:0 0 3px #f3d879}
.pet-sprite.raven .body,.pet-sprite.raven .head{background:linear-gradient(90deg,#10151b,#354253,#151a22)}
.pet-sprite.fox .body,.pet-sprite.fox .head{background:linear-gradient(90deg,#a94e27,#e17838 50%,#8e3f22)}
.pet-sprite.owl .body,.pet-sprite.owl .head{background:linear-gradient(90deg,#554738,#88735a,#4b4034)}
.pet-sprite.finch .body,.pet-sprite.finch .head{background:linear-gradient(90deg,#74572d,#d0a14d,#70522b)}

/* richer collection portraits */
.char-portrait{width:70px;height:90px;background:radial-gradient(circle at 50% 38%,#283640,#0c1217 72%);border:2px solid #606a72;box-shadow:inset 0 0 9px #000,0 2px 4px #0008}
.char-portrait .head{left:23px;top:10px;width:25px;height:25px;background:linear-gradient(90deg,#a76c4e,#d4946b 55%,#8f593f);box-shadow:inset 0 -4px #9a6046}
.char-portrait .body{left:15px;top:38px;width:41px;height:34px;background:linear-gradient(90deg,#34434f,#7a8b98,#3d4b55);box-shadow:inset 0 6px #a3afb7}
.char-portrait .legs{left:19px;top:70px;width:11px;height:16px;background:#373536;box-shadow:21px 0 #373536}
.char-portrait.rogue .body{background:linear-gradient(90deg,#27352c,#53684f,#2b392f)}
.char-portrait.barbarian .body{background:linear-gradient(90deg,#4b2f2a,#8b5547,#4b2e29)}
.char-portrait.paladin .body{background:linear-gradient(90deg,#55564f,#a8a38f,#5a5a52)}
.char-portrait.ranger .body{background:linear-gradient(90deg,#294331,#567b5e,#2b4835)}


/* v4.4 — 64-bit-era JRPG presentation */
:root{--gold:#c99b43;--gold2:#f1cf76;--panel:#101820;--panel2:#17232d;--edge:#5e4b2b;--ink:#e9e4d8}
body{background:
 radial-gradient(circle at 50% -20%,#203446 0,#0d141b 36%,#090d12 74%);
 color:var(--ink);font-family:Georgia,serif}
header{background:linear-gradient(180deg,#101a23,#0b1117);border-bottom:2px solid #705629;box-shadow:0 3px 12px #000}
header h1{color:#e4c376;text-shadow:0 2px #513710,0 0 9px #a9792b55;letter-spacing:.5px}
.resource{background:linear-gradient(#18232d,#10171e);border:1px solid #604d2c;border-radius:8px;box-shadow:inset 0 0 8px #000}
.card,.fighter,.panel,.item,.set-box,.char-card{background:linear-gradient(145deg,#17222b,#0e151b 65%);border-color:#5c4b2d;box-shadow:inset 0 0 12px #0008,0 2px 5px #0006}
.fighter{border-width:2px}
.bar{height:18px;border:2px solid #574c3b;background:#090d10;box-shadow:inset 0 2px 4px #000}
.fill.hp{background:linear-gradient(#e43c34,#a60e16)}
.fill.rage{background:linear-gradient(#ffb21b,#d47600)}
.fill.xp{background:linear-gradient(#2eb8eb,#1677a5)}
button{background:linear-gradient(#26597a,#173b53);border:1px solid #66849a;color:#f6f3eb;border-radius:7px;box-shadow:inset 0 1px #ffffff25,0 2px 3px #0008;font-family:Arial,sans-serif;font-weight:700}
button:active{transform:translateY(1px);box-shadow:inset 0 2px 5px #000}
#strikeBtn{background:linear-gradient(#b53827,#711a18);border-color:#df8b55;color:#fff5e8;text-shadow:0 2px #52120e;box-shadow:inset 0 2px #ffb17a55,0 3px 7px #000}
#cleaveBtn{background:linear-gradient(#7b351e,#442014);border-color:#a76a43}
.tabs button.active{background:linear-gradient(#805d22,#493612);border-color:#e2b85d;color:#fff4cf;box-shadow:inset 0 0 7px #f0c35b44}
.tabs{gap:5px}
.log{background:#090e12;border-color:#493d29}

/* Detailed 64-bit-era combat portraits */
.portrait{width:122px;height:146px;border:3px solid #6c5733;border-radius:10px;background:
 radial-gradient(circle at 50% 36%,#334a5c 0,#15222c 42%,#080d11 78%);
 box-shadow:inset 0 0 22px #000,0 0 0 1px #1d252b,0 4px 9px #000a;overflow:hidden}
.heroPix,.enemyPix{transform:scale(1.30);transform-origin:50% 60%;filter:drop-shadow(0 5px 2px #000b)}
.heroPix .face{background:linear-gradient(90deg,#8f553c 0 13%,#d79a70 14% 67%,#b56f4e 68% 84%,#73412f 85%);box-shadow:0 4px #633a2b,inset 0 -5px #a66349}
.heroPix .hair{background:linear-gradient(90deg,#241a15,#62452d 45%,#35251c);box-shadow:-7px 7px #34241b,7px 7px #34241b,0 -5px #1c1511}
.heroPix .body{background:linear-gradient(90deg,#252f36,#9aa8b0 30%,#596873 57%,#303a42 80%,#1c2429);box-shadow:inset 0 7px #c8d0d4,inset 0 -6px #222b31}
.heroPix .pauldron{background:linear-gradient(#eef0ed 0,#9ca6aa 35%,#566269 65%,#30383d);border:1px solid #222b30;box-shadow:35px 1px #5f6b72,inset 0 3px #fff9}
.heroPix .sword{background:linear-gradient(90deg,#56636c,#fafbf7 34%,#c6cdd0 57%,#727f87 78%,#39434a);box-shadow:0 -9px #f4f6f5,3px 0 #4a555c,-3px 0 #fff}
.heroPix:before{content:"";position:absolute;z-index:6;left:27px;top:27px;width:5px;height:3px;background:#171513;box-shadow:13px 0 #171513,2px 9px #8e4439,9px 9px #8e4439,5px 13px #d8a17d}
.enemyPix .face{background:linear-gradient(90deg,#5f3728,#b27551 45%,#75442f 72%,#492a21);box-shadow:inset 0 -5px #593226}
.enemyPix .body{background:linear-gradient(90deg,#2b2420,#9a6b4d 38%,#604536 68%,#2b2420);box-shadow:inset 0 7px #b98561,inset 0 -6px #2b211b}
.enemyPix.bounty .body{background:linear-gradient(90deg,#30201f,#b65c52 38%,#653532 70%,#271b1a)}
.enemyPix.boss{filter:drop-shadow(0 5px 2px #000) drop-shadow(0 0 8px #d08a3d)}
.portrait:after{background:
 linear-gradient(90deg,#ffffff05 1px,transparent 1px),
 linear-gradient(#ffffff04 1px,transparent 1px);
 background-size:2px 2px}

/* High-detail equipment icon frames */
.gear-icon{width:60px;height:60px;border:2px solid #70603f;border-radius:8px;background:
 radial-gradient(circle at 35% 25%,#435565,#19242c 48%,#090e12 78%);
 box-shadow:inset 0 0 12px #000,0 3px 5px #0008}
.gear-icon:before,.gear-icon:after{filter:drop-shadow(1px 2px 1px #000c)}
.gear-icon.Weapon:before{background:linear-gradient(90deg,#4c5963,#f7f8f4 30%,#aab5bb 58%,#59666e 80%,#333c42)}
.gear-icon.Helm:before{background:linear-gradient(#f0f0e9,#a3aaac 31%,#606b71 61%,#30383c)}
.gear-icon.Chest:before{background:linear-gradient(90deg,#39474f,#b7c0c3 37%,#6a777d 62%,#344047)}
.gear-icon.Gloves:before{background:linear-gradient(#bd906b,#7b5740 52%,#453126)}
.gear-icon.Boots:before{background:linear-gradient(#a47a59,#674b38 52%,#392a21)}
.item.Legendary .gear-icon{box-shadow:inset 0 0 12px #000,0 0 9px #d77a2d}
.item.Epic .gear-icon{box-shadow:inset 0 0 12px #000,0 0 9px #8e57cf}
.item.Rare .gear-icon{box-shadow:inset 0 0 12px #000,0 0 8px #d6ad3f}

/* High-detail pet sprites */
.pet-sprite{width:78px;height:70px;border:2px solid #5f573f;border-radius:9px;background:
 radial-gradient(circle at 44% 35%,#354651,#172129 50%,#090e12 80%);
 box-shadow:inset 0 0 13px #000,0 3px 6px #0009;overflow:hidden}
.pet-sprite .body{background:linear-gradient(90deg,#493225,#b17e59 38%,#80563e 66%,#402e25);box-shadow:inset 0 6px #d3a078,inset 0 -4px #4d3528,6px 10px #33251e}
.pet-sprite .head{background:linear-gradient(90deg,#513426,#c08a61 45%,#7c5039 70%,#432d23);box-shadow:inset -5px -4px #593a2b}
.pet-sprite .eye{width:4px;height:4px;background:#fff1a1;box-shadow:0 0 4px #ffd75c}
.pet-sprite.raven .body,.pet-sprite.raven .head{background:linear-gradient(90deg,#080b10,#3f5269 42%,#1a2330 68%,#080b10)}
.pet-sprite.fox .body,.pet-sprite.fox .head{background:linear-gradient(90deg,#8f351d,#ef813c 43%,#b84c26 68%,#6b291b)}
.pet-sprite.owl .body,.pet-sprite.owl .head{background:linear-gradient(90deg,#42362b,#9a8265 40%,#675543 68%,#352d27)}
.pet-sprite.finch .body,.pet-sprite.finch .head{background:linear-gradient(90deg,#62451f,#e3b653 43%,#a47530 68%,#52391d)}
.pet-sprite.goat .body,.pet-sprite.goat .head{background:linear-gradient(90deg,#665f58,#c0b7a9 43%,#8d8479 68%,#514c47)}

/* 64-bit character collection portraits */
.char-portrait{width:78px;height:98px;border:2px solid #6d6042;border-radius:7px;background:
 radial-gradient(circle at 50% 35%,#3c5261,#16232c 48%,#090e12 80%);
 box-shadow:inset 0 0 12px #000,0 3px 6px #0009;overflow:hidden}
.char-portrait .head{left:25px;top:9px;width:29px;height:29px;background:linear-gradient(90deg,#8f573f,#d99b71 47%,#b36e4e 70%,#75432f);box-shadow:inset 0 -5px #955b43}
.char-portrait .body{left:15px;top:41px;width:49px;height:39px;background:linear-gradient(90deg,#26323a,#a2afb7 35%,#66757e 62%,#303b42);box-shadow:inset 0 7px #d1d7da,inset 0 -5px #293239}
.char-portrait .legs{left:20px;top:78px;width:12px;height:17px;background:linear-gradient(#484546,#29282a);box-shadow:25px 0 #343235}
.char-portrait.rogue .body{background:linear-gradient(90deg,#1d2922,#647c5e 39%,#35473b 70%,#1d2922)}
.char-portrait.barbarian .body{background:linear-gradient(90deg,#39231f,#a66250 40%,#62382f 70%,#321f1c)}
.char-portrait.paladin .body{background:linear-gradient(90deg,#41433e,#c1bcaa 38%,#77776d 67%,#393b38)}

.char-card.active-char{border-color:#e0b95f;box-shadow:inset 0 0 12px #000,0 0 9px #c8943d66}

/* compact ornate labels */

.small{color:#aeb8bd}
.good,.skill-total,.set-on{color:#75db91}

.heroPix,.enemyPix{width:96px!important;height:112px!important;background-repeat:no-repeat!important;background-position:center bottom!important;background-size:96px 112px!important;transform:none!important;filter:drop-shadow(0 5px 3px #000b)!important}
.heroPix>* ,.enemyPix>*{display:none!important}
.heroPix:before,.heroPix:after,.enemyPix:before,.enemyPix:after{display:none!important}
.battle{background:
 linear-gradient(#0a1118cc,#0a1118cc),
 radial-gradient(circle at 50% 30%,#334a3c 0,#1b2925 35%,#10171a 68%);
 border:2px solid #735b30;border-radius:10px;padding:12px;box-shadow:inset 0 0 28px #000,0 3px 8px #0009}
.fighter{background:linear-gradient(145deg,#17232d,#0b1117);border:2px solid #665231}
.fighter h2,.fighter h3{color:#e4c77d}
.stats{font-family:Arial,sans-serif}
#beginPanel{background:linear-gradient(#19232b,#0e151a);border:2px solid #826530;box-shadow:inset 0 0 16px #000}
header{border-bottom:3px double #8b6c35}
.item{border-radius:8px}
.item:hover{border-color:#8c7447}


/* v4.4 — mockup-directed playable UI overhaul */
body{background:
 radial-gradient(ellipse at 50% 0,#23394a 0,#101a22 32%,#080d12 72%);
 background-attachment:fixed}
header{position:relative;background:
 linear-gradient(180deg,#15232d 0,#0a1117 100%);
 border:2px solid #69522d;border-left:0;border-right:0;
 box-shadow:inset 0 -5px 14px #0008,0 4px 12px #000b}
header:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:#d0a75566}
.resource{min-width:76px;padding:7px 9px;background:
 linear-gradient(180deg,#1e2c36,#0c1319);
 border:1px solid #705a35;box-shadow:inset 0 0 10px #000,0 1px #c7a55a33}
.resource b{color:#f1cf78;text-shadow:0 1px #33220b}

/* The battle becomes one framed scene, visually closer to the mockup. */
.battle{position:relative;overflow:hidden;gap:10px;padding:18px 12px 14px;
 background:
 linear-gradient(180deg,#14222a55,#081014cc),
 radial-gradient(ellipse at 50% 88%,#314334 0 16%,#1c2b25 17% 35%,transparent 36%),
 linear-gradient(180deg,#203642 0 35%,#162b27 36% 66%,#0c1715 67%);
 border:3px ridge #806638;border-radius:12px;
 box-shadow:inset 0 0 35px #000,inset 0 -18px 30px #0007,0 4px 10px #000b}
.battle:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.65;
 background:
 radial-gradient(circle at 13% 24%,#263d31 0 8%,transparent 9%),
 radial-gradient(circle at 85% 19%,#2a4235 0 10%,transparent 11%),
 linear-gradient(100deg,transparent 0 12%,#18241e 12% 14%,transparent 14% 83%,#17231e 83% 85%,transparent 85%)}
.battle:after{content:"";position:absolute;left:0;right:0;bottom:0;height:31%;
 pointer-events:none;background:
 repeating-linear-gradient(170deg,#26372d22 0 3px,#10191522 3px 7px)}
.fighter{position:relative;z-index:1;min-height:225px;background:
 linear-gradient(180deg,#111b22e8,#0a1015e8);
 border:2px solid #735d38;border-radius:9px;
 box-shadow:inset 0 0 15px #000b,0 3px 7px #0008}
.fighter:first-child{border-color:#806c46}
.fighter:last-child{border-color:#745044}
.portrait{width:138px;height:154px;background:
 radial-gradient(circle at 50% 45%,#3d5662aa,#17242caa 50%,#080d11ee 78%);
 border:2px solid #947642;box-shadow:inset 0 0 22px #000,0 3px 8px #000b}
.heroPix,.enemyPix{width:112px!important;height:130px!important;background-size:112px 130px!important;
 image-rendering:pixelated;filter:drop-shadow(0 7px 3px #000c)!important}
.fighter h2,.fighter h3{font-size:18px;margin-bottom:5px;text-shadow:0 2px #000}
.bar{height:20px;border:2px solid #65563f;border-radius:4px;overflow:hidden}
.fill{box-shadow:inset 0 2px #ffffff30,inset 0 -3px #0004}

/* Mockup-like central command deck */
.controls{background:linear-gradient(180deg,#111b23,#090f14);
 border:2px solid #65502d;border-radius:10px;padding:9px;
 box-shadow:inset 0 0 13px #000,0 3px 7px #0008}
#strikeBtn{min-height:58px;font-size:18px;letter-spacing:.7px;
 background:linear-gradient(#bd442d,#721b18 65%,#4c1111);
 border:2px solid #dc8b55;box-shadow:inset 0 2px #ffc29466,0 3px 6px #000b}
#cleaveBtn{min-height:48px;background:linear-gradient(#824022,#4b2116);
 border:2px solid #a66c43}
.progress-rule{display:inline-flex;align-items:center;justify-content:center;
 min-height:30px;padding:3px 8px;margin-left:4px;border:1px solid #766039;border-radius:5px;
 background:#121c22;color:#d7bd7b;font:700 10px Arial,sans-serif;letter-spacing:.5px}

/* Ornate tab rail and content panels */
.tabs{padding:5px;background:linear-gradient(#101920,#090e12);
 border:1px solid #59482b;border-radius:8px}
.tabs button{min-height:42px;background:linear-gradient(#263746,#14232d);
 border:1px solid #536779}
.tabs button.active{background:linear-gradient(#896527,#4c3713);
 border-color:#dfb65b;color:#fff1c4}
.panel{border:2px solid #604d2f;background:
 linear-gradient(145deg,#16232c,#0b1116 68%);
 box-shadow:inset 0 0 20px #000a,0 3px 8px #0008}
.panel h2,.panel h3{border-bottom:1px solid #5e4b2d;padding-bottom:6px}

/* Richer collection/equipment tiles */
.item,.char-card,.pet-card{position:relative;background:
 linear-gradient(145deg,#1a2832,#0d151b 70%);
 border:2px solid #544832;box-shadow:inset 0 0 13px #000a,0 2px 5px #0008}
.item:before,.char-card:before,.pet-card:before{content:"";position:absolute;inset:2px;
 border:1px solid #ffffff0b;border-radius:5px;pointer-events:none}
.gear-icon,.pet-sprite,.char-portrait{border-color:#806943;
 box-shadow:inset 0 0 15px #000,0 3px 7px #000b}
.skill button{background:linear-gradient(#2b465b,#173044);border:1px solid #6a8292}
.skill button:not(:disabled){box-shadow:inset 0 1px #fff3,0 0 7px #3b8ab433}
.modal{background:#060a0de8}
.modal-card{background:linear-gradient(#17242d,#0b1116);border:3px ridge #806638;
 box-shadow:inset 0 0 22px #000,0 8px 25px #000}

/* Mobile: retain the mockup's dense game HUD without overflow. */
@media(max-width:560px){
 .battle{padding:11px 6px 10px;gap:5px}
 .fighter{min-height:205px;padding:7px}
 .portrait{width:112px;height:137px}
 .heroPix,.enemyPix{width:96px!important;height:116px!important;background-size:96px 116px!important}
 .fighter h2,.fighter h3{font-size:15px}
 .resource{min-width:64px;padding:5px 6px}
 #strikeBtn{min-height:54px}
}


/* v4.4 — reference-composition rebuild */
:root{--wr-gold:#d0a24a;--wr-gold-hi:#f3d582;--wr-blue:#12364c;--wr-deep:#071018;--wr-panel:#0c1821}
body{margin:0;background:#071018;color:#f3efe5;font-family:Arial,sans-serif}
header{display:grid!important;grid-template-columns:minmax(250px,1.25fr) repeat(4,minmax(92px,.45fr));gap:6px!important;
 align-items:stretch!important;padding:5px 8px!important;background:#08131b!important;border-bottom:2px solid #9a7335!important}
header h1{font-family:Georgia,serif!important;font-size:clamp(24px,3vw,39px)!important;letter-spacing:1px!important;
 color:#f0d58b!important;margin:0!important;padding:8px 10px!important;background:linear-gradient(90deg,#0d1b25,#09131a)!important;
 border:1px solid #5e4a2a!important;text-shadow:0 2px #49300e,0 0 8px #d09c3c55!important}
.resource{display:flex!important;flex-direction:column!important;justify-content:center!important;min-height:53px!important;
 background:linear-gradient(145deg,#13232e,#091219)!important;border:1px solid #52616a!important;border-radius:4px!important;
 font-size:13px!important}.resource b{font-size:19px!important;color:#fff!important}

/* Desktop/tablet: reference-like left nav + main game area */
main{max-width:1536px!important;margin:auto!important;padding:6px!important}
.tabs{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:5px!important;margin:5px 0!important;
 background:#08131a!important;border:1px solid #806335!important}
.tabs button{border-radius:3px!important;min-height:47px!important;font-size:14px!important;
 background:linear-gradient(#163b53,#0d2637)!important;border:1px solid #63849a!important}
.tabs button.active{background:linear-gradient(#285a79,#12384f)!important;border:2px solid #d5a950!important;
 box-shadow:inset 0 0 8px #000,0 0 5px #d7a63b55!important}

/* Stage banner */
.stage-nav{background:linear-gradient(90deg,#102431,#0a1720,#102431)!important;border:2px solid #74582d!important;
 border-radius:4px!important;padding:6px!important;box-shadow:inset 0 0 10px #000!important}
.stage-nav button{background:#102d40!important;border-color:#657c89!important}

/* Battlefield becomes the hero visual, like the reference */
.battle{min-height:360px!important;display:grid!important;grid-template-columns:1fr 1fr!important;align-items:end!important;
 position:relative!important;padding:22px 24px 16px!important;border:3px solid #9a7335!important;border-radius:3px!important;
 background:
 linear-gradient(180deg,transparent 0 66%,#07100dcc 67%),
 radial-gradient(ellipse at 50% 94%,#506044 0 12%,#29392c 13% 29%,transparent 30%),
 radial-gradient(circle at 14% 25%,#315344 0 9%,transparent 10%),
 radial-gradient(circle at 86% 24%,#294a3b 0 11%,transparent 12%),
 linear-gradient(180deg,#326178 0 27%,#718a89 28% 29%,#294b3c 30% 62%,#172b24 63% 100%)!important;
 box-shadow:inset 0 0 48px #000b!important;overflow:hidden!important}
.battle:before{content:"";position:absolute!important;inset:0!important;opacity:.85!important;pointer-events:none!important;
 background:
 linear-gradient(110deg,transparent 0 9%,#111b17 9% 11%,transparent 11% 88%,#111b17 88% 90%,transparent 90%),
 radial-gradient(ellipse at 50% 58%,transparent 0 27%,#14231c55 28% 35%,transparent 36%),
 repeating-linear-gradient(90deg,transparent 0 95px,#d3d6c80b 96px 99px)!important}
.fighter{z-index:2!important;min-height:315px!important;border:0!important;background:transparent!important;box-shadow:none!important;
 display:flex!important;flex-direction:column!important;justify-content:flex-end!important}
.fighter:first-child{align-items:flex-start!important}.fighter:last-child{align-items:flex-end!important}
.portrait{width:210px!important;height:240px!important;border:0!important;background:transparent!important;
 box-shadow:none!important;overflow:visible!important}
.heroPix,.enemyPix{width:190px!important;height:225px!important;background-size:190px 225px!important;
 filter:drop-shadow(0 10px 5px #000c)!important}
.fighter .bar{width:min(100%,300px)!important;height:16px!important;background:#080b0d!important;border:2px solid #23282a!important}
.fighter .stats{max-width:300px!important;background:#071018cc!important;padding:4px 7px!important;border:1px solid #5b4a2e!important;border-radius:3px!important}
.fighter h2,.fighter h3{background:#071018cc!important;padding:3px 7px!important;margin:2px 0!important;color:#fff0c3!important}

/* Attack deck mirrors the large red command bar in the reference */
.controls{display:grid!important;grid-template-columns:minmax(240px,1.8fr) minmax(130px,.7fr) minmax(120px,.5fr)!important;
 gap:7px!important;padding:7px!important;background:#08131a!important;border:2px solid #8a6832!important}
#strikeBtn{min-height:72px!important;font-family:Georgia,serif!important;font-size:clamp(20px,3vw,35px)!important;
 text-transform:uppercase!important;background:linear-gradient(#d4442b,#a41d18 56%,#68100f)!important;border:3px ridge #e0a15f!important}
#cleaveBtn{min-height:72px!important;font-size:17px!important;background:linear-gradient(#301711,#761d0d)!important;border:2px solid #9f5c32!important}
.controls button:not(#strikeBtn):not(#cleaveBtn){min-height:58px!important;background:linear-gradient(#16472c,#0d2c1d)!important;border:2px solid #3b9a5a!important}

/* Dense lower dashboard */
.panel{padding:8px!important;border:2px solid #6f552e!important;border-radius:3px!important;background:#09151d!important}
.panel h2,.panel h3{font-family:Georgia,serif!important;color:#e6c573!important;margin:3px 0 7px!important;text-transform:uppercase!important}
.grid{gap:6px!important}
.item,.char-card,.pet-card,.skill{border-radius:3px!important;background:linear-gradient(#12232e,#091219)!important;border:1px solid #526b78!important}
.char-card.active-char{border:2px solid #f0b83e!important;box-shadow:inset 0 0 10px #000,0 0 8px #e6aa31!important}
.char-portrait{width:88px!important;height:108px!important}.pet-sprite{width:84px!important;height:76px!important}
.gear-icon{width:66px!important;height:66px!important}
.skill{display:grid!important;grid-template-columns:minmax(110px,1fr) auto!important;align-items:center!important;padding:7px!important}
.skill button:not(:disabled){background:linear-gradient(#20a845,#0b702a)!important;border:2px solid #54df72!important;color:#fff!important}

/* More compact log; artwork/UI gets priority */
.log{max-height:92px!important;overflow:auto!important;background:#060c10!important;border:1px solid #3d3628!important}

/* Wide screens: tabs become a left rail like the supplied reference */
@media(min-width:900px){
 main{display:grid!important;grid-template-columns:154px minmax(0,1fr)!important;grid-template-areas:
 "tabs stage" "tabs battle" "tabs controls" "tabs content" "tabs log"!important;gap:5px!important}
 .tabs{grid-area:tabs!important;display:flex!important;flex-direction:column!important;margin:0!important;padding:5px!important}
 .tabs button{width:100%!important;text-align:left!important;min-height:55px!important}
 .stage-nav{grid-area:stage!important}.battle{grid-area:battle!important}.controls{grid-area:controls!important}
 #content,.content,.panels{grid-area:content!important}.log{grid-area:log!important}
}
@media(max-width:650px){
 header{grid-template-columns:1fr 1fr!important}header h1{grid-column:1/-1!important}
 .battle{min-height:295px!important;padding:12px 7px!important}
 .portrait{width:145px!important;height:184px!important}.heroPix,.enemyPix{width:140px!important;height:175px!important;background-size:140px 175px!important}
 .fighter{min-height:260px!important}
 .controls{grid-template-columns:1fr 1fr!important}#strikeBtn{grid-column:1/-1!important}
 .tabs{grid-template-columns:repeat(3,1fr)!important}
}


/* v4.4 runtime-safe mobile reconstruction */
.build-badge{display:none!important}
.encounter-strip{display:grid;grid-template-columns:1fr minmax(100px,1fr) auto;gap:8px;align-items:center;
 padding:7px 9px;background:linear-gradient(#142735,#09151e);border:2px solid #826433;border-bottom:0;
 color:#f2dfad;font-size:12px}
#encounterStage{display:block;color:#fff;font-size:15px}
.encounter-progress{height:12px;border:2px solid #54482f;background:#080d10;border-radius:8px;overflow:hidden}
.encounter-progress span{display:block;width:42%;height:100%;background:linear-gradient(#f4b72e,#bf7212)}
.mode-chip{padding:5px 7px;border:1px solid #7b653c;background:#10202a;color:#e5c779;font-weight:800;border-radius:4px}
#beginPanel{
 display:flex!important;align-items:center;justify-content:center;gap:10px;
 margin:8px 0;padding:10px;background:linear-gradient(#172630,#09141b);
 border:2px solid #876735;border-radius:6px;box-shadow:inset 0 0 12px #000;
}
#beginPanel.hidden{display:none!important}
#beginBtn{min-height:58px;min-width:220px;font:800 21px Georgia,serif;
 background:linear-gradient(#c13e29,#7d1714)!important;border:3px ridge #dfa05c!important;
 color:#fff4d9!important;text-transform:uppercase}
.heroPix.warrior,.heroPix.rogue,.heroPix.barbarian,.heroPix.paladin,.heroPix.ranger,
.enemyPix.beggar,.enemyPix.thief,.enemyPix.bounty,.enemyPix.boss{display:block!important}
.fighter .name{font-size:17px!important;font-weight:800!important;color:#fff2c6!important}
.char-grid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))!important;gap:7px!important}
@media(max-width:650px){
 .app{padding-bottom:20px}
 header{display:block!important;padding:7px!important}
 header>div:first-child{display:flex;align-items:center;justify-content:space-between}
 header .title{font:700 24px Georgia,serif!important;color:#f1d58a}
 header .curr{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:4px!important;margin-top:6px}
 .pill{display:flex!important;justify-content:center!important;padding:6px 3px!important;background:#0d1b24!important;border:1px solid #5e5138!important}
 .encounter-strip{grid-template-columns:1fr auto!important}.encounter-progress{grid-column:1/-1;grid-row:2}
 .battle{min-height:330px!important}
 .fighter{min-width:0!important}
 .portrait{width:145px!important;height:190px!important}
 .heroPix,.enemyPix{width:145px!important;height:180px!important;background-size:145px 180px!important}
 .fighter .stats{font-size:10px!important}
 .actions{display:grid!important;grid-template-columns:1fr!important;gap:7px!important}
 .toggles{display:flex!important;justify-content:flex-start!important}
 .tabs{grid-template-columns:repeat(3,1fr)!important}
}


/* v4.4 explicit runtime-safe meters */
.fighter .bar{display:block!important;position:relative!important;width:min(100%,300px)!important;
 height:18px!important;min-height:18px!important;margin:4px 0!important;padding:0!important;
 overflow:hidden!important;background:#080b0d!important;border:2px solid #4f493b!important;border-radius:4px!important}
.fighter .bar .fill{display:block!important;height:100%!important;min-height:100%!important;border-radius:1px!important}
.fighter .bar .hp,.fighter .bar .fill.hp{background:linear-gradient(#e84b42,#a91018)!important}
.fighter .bar .rage,.fighter .bar .fill.rage{background:linear-gradient(#ffb321,#cf7100)!important}
.fighter .bar .xp,.fighter .bar .fill.xp{background:linear-gradient(#35b9e8,#1477a7)!important}

.controls{position:relative!important;margin-top:-2px!important;border-top:3px solid #b08339!important}
#strikeBtn{font-size:32px!important;letter-spacing:.4px!important}
.panel{background:linear-gradient(145deg,#0d1b24,#071017)!important;border-color:#7c6034!important}
.char-card,.item,.pet-card,.skill{background:linear-gradient(145deg,#152733,#09141b)!important}
.char-card.active-char{border-color:#f1bc45!important;box-shadow:inset 0 0 14px #000,0 0 10px #d79b31!important}
@media(max-width:650px){
 main{padding:3px!important}
 header{padding:4px!important}
 header h1,.title{font-size:21px!important;padding:4px!important}
 .curr{gap:2px!important}.pill,.resource{font-size:10px!important;padding:4px 2px!important;min-height:38px!important}
 .encounter-strip{padding:5px 6px!important}
 .battle{min-height:310px!important;padding:5px 8px 8px!important}
 .fighter{min-height:290px!important}
 .portrait{width:158px!important;height:220px!important}
 .heroPix,.enemyPix{width:155px!important;height:215px!important}
 .fighter h2,.fighter h3{font-size:13px!important;padding:2px 4px!important}
 .fighter .stats{font-size:9px!important;padding:2px 4px!important}
 .fighter .bar{height:13px!important;min-height:13px!important;margin:2px 0!important}
 .controls{grid-template-columns:1.55fr .9fr!important;padding:5px!important}
 #strikeBtn{grid-column:1/2!important;min-height:64px!important;font-size:25px!important}
 #cleaveBtn{grid-column:2/3!important;min-height:64px!important;font-size:14px!important}
 .toggles{grid-column:1/-1!important}
 .toggles button{min-height:40px!important}
 .tabs{position:relative!important;display:grid!important;grid-template-columns:repeat(6,1fr)!important;gap:2px!important;padding:3px!important}
 .tabs button{min-height:44px!important;font-size:0!important;padding:3px!important;text-align:center!important}
 .tabs button::first-letter{font-size:20px!important}
 .panel{padding:5px!important}
 .char-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .char-portrait{width:74px!important;height:94px!important}
}

:root{--hud:#08141c;--hud2:#102634;--line:#9b7435;--hi:#f1ce77}
.app{max-width:1180px!important;background:#071018}
header{padding:7px 9px!important;background:linear-gradient(#0d1d27,#071119)!important;border-bottom:2px solid var(--line)!important}
.title{font-size:30px!important;color:#f3d488!important;text-shadow:0 2px #3b260d}
.curr{display:grid!important;grid-template-columns:repeat(4,minmax(90px,1fr))!important}
.pill{background:linear-gradient(#132734,#09151d)!important;border:1px solid #5e6c73!important;border-radius:3px!important}
.encounter-strip{border:2px solid var(--line)!important;background:linear-gradient(#142a38,#09151e)!important}
.battle{min-height:420px!important;grid-template-columns:1fr 1fr!important;align-items:end!important;padding:12px 20px!important}
.fighter{min-height:385px!important;justify-content:flex-end!important}
.portrait{width:270px!important;height:315px!important;overflow:visible!important}
.heroPix,.enemyPix{width:260px!important;height:305px!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:center bottom!important;image-rendering:auto!important;filter:drop-shadow(0 12px 8px #0009)!important}
.heroPix>* ,.enemyPix>*{display:none!important}
.combat-meter{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:5px;width:min(330px,100%);margin:4px 0;font:800 11px Arial}
.combat-meter>b{color:#d7c28e;text-align:right}
.meter-track{height:22px;position:relative;overflow:hidden;border:2px solid #54492f;border-radius:3px;background:#080c0f;box-shadow:inset 0 0 7px #000}
.meter-fill{height:100%;width:0;transition:width .15s ease;box-shadow:inset 0 2px #ffffff38,inset 0 -3px #0005}
.meter-track span{position:absolute;inset:0;display:grid;place-items:center;font:800 12px Arial;color:white;text-shadow:0 1px 2px #000}
.hp-meter .meter-fill,.enemy-meter .meter-fill{background:linear-gradient(#ed453d,#a70e16)}
.rage-meter .meter-fill{background:linear-gradient(#ffc12a,#d26e00)}
.xp-meter .meter-fill{background:linear-gradient(#39c9f3,#1178ae)}
.fighter .stats{background:#061019d9!important;border:1px solid #69542f!important;padding:4px!important;max-width:330px}
.controls{grid-template-columns:1.8fr .75fr .55fr!important;background:#071119!important;border:2px solid var(--line)!important}
#strikeBtn{background:linear-gradient(#dc432c,#9f1715 60%,#68100e)!important;border:3px ridge #e3a25e!important;font-size:30px!important}
#cleaveBtn{background:linear-gradient(#481b12,#8c260f)!important}
.tabs{background:#071119!important;border:1px solid #6c552f!important}
.tabs button{background:linear-gradient(#15384e,#0b2637)!important}
.tabs button.active{background:linear-gradient(#2a5f7d,#123b52)!important;border-color:#e0ad4d!important}
.pane{background:linear-gradient(#0e1e28,#081219)!important;border:2px solid #6e562f!important}
.gear-icon{width:70px!important;height:70px!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;border:1px solid #816438!important;border-radius:4px!important}
.gear-icon:before,.gear-icon:after{display:none!important}
.item{background:linear-gradient(145deg,#142631,#09131a)!important}
@media(min-width:900px){
 main{display:grid!important;grid-template-columns:150px 1fr!important;grid-template-areas:"tabs stage" "tabs battle" "tabs log" "tabs nav" "tabs controls" "tabs content"!important;gap:5px!important}
 .tabs{grid-area:tabs!important;display:flex!important;flex-direction:column!important}.tabs button{min-height:58px!important;text-align:left!important}
 .encounter-strip{grid-area:stage!important}.battle{grid-area:battle!important}.log{grid-area:log!important}.nav{grid-area:nav!important}.actions,.controls{grid-area:controls!important}
 #gear,#skills,#boons,#characters,#pets,#system{grid-area:content!important}
}
@media(max-width:650px){
 .app{width:100%!important}
 header{display:block!important}.title{font-size:23px!important}.curr{grid-template-columns:repeat(4,1fr)!important;gap:2px!important}
 .pill{padding:4px 2px!important;font-size:10px!important}
 .battle{min-height:335px!important;padding:5px 7px!important}

<script>
const VERSION="4.4", SAVE="wanderersRoadV44";
const rarities=[["Normal",65],["Magic",25],["Rare",8],["Epic",1.8],["Legendary",.2]];
const bases={Weapon:["Rusty Sword","Iron Sword","Hunter Blade","Mercenary Axe"],Helm:["Cloth Hood","Leather Cap","Iron Helm"],Chest:["Torn Tunic","Leather Jerkin","Chain Vest"],Gloves:["Cloth Wraps","Leather Gloves","Iron Gauntlets"],Boots:["Worn Boots","Trail Boots","Iron Greaves"]};
const affixes=["ATK","HP","Armor","Crit","CritDmg","AttackSpeed","GoldFind","SoulFind","LifeSteal"];
const aspects=["Bloodletter","Soul Reaper","Treasure Seeker","Ironhide","Rageborn","Cleaving Wind"];
const boonPool=[["Bloodlust","+10% Attack Speed"],["Executioner","+15% damage below 30% enemy HP"],["Soul Feast","+20% Souls"],["Treasure Hunter","+20% Gold"],["Critical Focus","+5% Crit"],["Heavy Blows","+25% Crit Damage"],["Fortification","+15% Armor"],["Boss Slayer","+20% Boss Damage"]];
const petDefs={
hound:{name:"Stray Hound",type:"Domesticated",rarity:"Common",sprite:"hound",sets:["Domesticated"],perk:{k:"GoldFind",v:1},active:{k:"GoldFind",v:5},unlock:1,affix:{k:"HP",v:8}},
cat:{name:"Barn Cat",type:"Domesticated",rarity:"Common",sprite:"cat",sets:["Domesticated"],perk:{k:"Crit",v:.5},active:{k:"Crit",v:3},unlock:3,affix:{k:"AttackSpeed",v:2}},
rabbit:{name:"Wild Rabbit",type:"Wild",rarity:"Common",sprite:"rabbit",sets:["Woodland"],perk:{k:"AttackSpeed",v:1},active:{k:"AttackSpeed",v:4},unlock:5,affix:{k:"HP",v:10}},
raven:{name:"Black Raven",type:"Wild",rarity:"Magic",sprite:"raven",sets:["Flying","Woodland"],perk:{k:"SoulFind",v:1},active:{k:"SoulFind",v:8},unlock:7,affix:{k:"CritDmg",v:4}},
fox:{name:"Red Fox",type:"Wild",rarity:"Magic",sprite:"fox",sets:["Woodland"],perk:{k:"CritDmg",v:1},active:{k:"CritDmg",v:10},unlock:9,affix:{k:"Crit",v:1}},
squirrel:{name:"Red Squirrel",type:"Wild",rarity:"Common",sprite:"squirrel",sets:["Woodland"],perk:{k:"GoldFind",v:1},active:{k:"GoldFind",v:4},unlock:11,affix:{k:"AttackSpeed",v:2}},
hedgehog:{name:"Hedgehog",type:"Wild",rarity:"Magic",sprite:"hedgehog",sets:["Woodland"],perk:{k:"ArmorPct",v:1},active:{k:"ArmorPct",v:6},unlock:13,affix:{k:"Armor",v:2}},
owl:{name:"Tawny Owl",type:"Wild",rarity:"Rare",sprite:"owl",sets:["Flying","Woodland"],perk:{k:"SoulFind",v:1.5},active:{k:"CritDmg",v:12},unlock:15,affix:{k:"SoulFind",v:4}},
finch:{name:"Golden Finch",type:"Wild",rarity:"Rare",sprite:"finch",sets:["Flying"],perk:{k:"GoldFind",v:1.5},active:{k:"AttackSpeed",v:6},unlock:17,affix:{k:"GoldFind",v:4}},
goat:{name:"Pygmy Goat",type:"Domesticated",rarity:"Rare",sprite:"goat",sets:["Domesticated"],perk:{k:"HPpct",v:1},active:{k:"ArmorPct",v:8},unlock:19,affix:{k:"HP",v:18}}
};
const petSets={
Flying:{members:["raven","owl","finch"],tiers:[{n:2,text:"+2% Soul Find",k:"SoulFind",v:2},{n:3,text:"+3% Crit Damage",k:"CritDmg",v:3}]},
Domesticated:{members:["hound","cat","goat"],tiers:[{n:2,text:"+2% Gold Find",k:"GoldFind",v:2},{n:3,text:"+2% Max HP",k:"HPpct",v:2}]},
Woodland:{members:["rabbit","raven","fox","squirrel","hedgehog","owl"],tiers:[{n:3,text:"+2% Attack Speed",k:"AttackSpeed",v:2},{n:5,text:"+3% Crit Damage",k:"CritDmg",v:3},{n:6,text:"+2% Armor",k:"ArmorPct",v:2}]}
};
const characterDefs={
warrior:{name:"Warrior",rarity:"Common",sets:["Melee","Vanguard"],perk:{k:"ArmorPct",v:1},perkText:"+1% Armor",activeText:"+10% Armor while active",activeStat:{k:"ArmorPct",v:10},unlock:1},
rogue:{name:"Rogue",rarity:"Common",sets:["Melee"],perk:{k:"Crit",v:1},perkText:"+1% Crit Chance",activeText:"+8% Crit Chance while active",activeStat:{k:"Crit",v:8},unlock:6},
barbarian:{name:"Barbarian",rarity:"Magic",sets:["Melee","Vanguard"],perk:{k:"CritDmg",v:2},perkText:"+2% Crit Damage",activeText:"+15% Crit Damage while active",activeStat:{k:"CritDmg",v:15},unlock:11},
paladin:{name:"Paladin",rarity:"Magic",sets:["Vanguard"],perk:{k:"HPpct",v:2},perkText:"+2% Max HP",activeText:"+12% Max HP while active",activeStat:{k:"HPPct",v:12},unlock:16},
ranger:{name:"Ranger",rarity:"Rare",sets:["Ranged"],perk:{k:"AttackSpeed",v:2},perkText:"+2% Attack Speed",activeText:"+10% Attack Speed while active",activeStat:{k:"AttackSpeed",v:10},unlock:20}
};
const characterSets={
Melee:{members:["warrior","rogue","barbarian"],tiers:[{n:2,text:"+2% ATK",k:"ATKPct",v:2},{n:3,text:"+3% Crit Damage",k:"CritDmg",v:3}]},
Vanguard:{members:["warrior","barbarian","paladin"],tiers:[{n:2,text:"+2% Max HP",k:"HPpct",v:2},{n:3,text:"+3% Armor",k:"ArmorPct",v:3}]},
Ranged:{members:["ranger","hunter","arcanist"],tiers:[{n:2,text:"+2% Attack Speed",k:"AttackSpeed",v:2},{n:3,text:"+3% Crit Chance",k:"Crit",v:3}]}
};
function statText(x){let names={GoldFind:"Gold Find",SoulFind:"Soul Find",Crit:"Crit Chance",CritDmg:"Crit Damage",AttackSpeed:"Attack Speed",ArmorPct:"Armor",HPpct:"Max HP",HP:"HP",Armor:"Armor",ATK:"ATK"};return `+${x.v}${["HP","Armor","ATK"].includes(x.k)?"":"%"} ${names[x.k]||x.k}`}
function applyPetStat(h,x){if(!x)return;if(x.k==="GoldFind")h.gold+=x.v/100;if(x.k==="SoulFind")h.soul+=x.v/100;if(x.k==="Crit")h.crit+=x.v/100;if(x.k==="CritDmg")h.critDmg+=x.v/100;if(x.k==="AttackSpeed")h.spd+=x.v/100;if(x.k==="ArmorPct")h.armor*=1+x.v/100;if(x.k==="HPpct")h.hp*=1+x.v/100;if(x.k==="HP")h.hp+=x.v;if(x.k==="Armor")h.armor+=x.v;if(x.k==="ATK")h.atk+=x.v;if(x.k==="ATKPct")h.atk*=1+x.v/100}
const skillDefs={Strength:{label:"Strength Training",cost:10,base:1,unit:"ATK",desc:"Base bonus at Level 1; +20% compounded each additional level"},Vitality:{label:"Vitality",cost:10,base:10,unit:"HP",desc:"Base bonus at Level 1; +20% compounded each additional level"},Skin:{label:"Thick Skin",cost:10,base:1,unit:"Armor",desc:"Base bonus at Level 1; +20% compounded each additional level"},Precision:{label:"Precision",cost:15,base:.5,unit:"% Crit Chance",desc:"Base bonus at Level 1; +20% compounded each additional level"},SoulReaper:{label:"Soul Reaper",cost:15,base:2,unit:"% Soul Find",desc:"Base bonus at Level 1; +20% compounded each additional level"},LifeSteal:{label:"Blood Drinker",cost:15,base:1,unit:"% Life Steal",desc:"Base bonus at Level 1; +20% compounded each additional level"}};
function fresh(){return {version:VERSION,stage:1,highest:1,checkpoint:1,level:1,xp:0,hp:150,rage:0,gold:0,souls:0,fate:0,legacy:0,started:false,autoSkill:false,progress:false,gear:{},inventory:[],stash:[],materials:{Dust:0,Crystals:0,Shards:0,Cores:0},skills:{Strength:0,Vitality:0,Skin:0,Precision:0,SoulReaper:0,LifeSteal:0},boons:[],kills:0,prestiges:0,petsOwned:["hound"],equippedPet:"hound",charactersOwned:["warrior"],activeCharacter:"warrior",enemy:null}}
let S=fresh(), timer=null;
try{let x=JSON.parse(localStorage.getItem(SAVE));if(x)S=Object.assign(fresh(),x)}catch(e){}
function round2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100}
function fmt(n){let v=round2(n);return Number.isInteger(v)?String(v):v.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")}
function skillBonus(k){let r=S.skills[k]||0,d=skillDefs[k];return r?round2(d.base*Math.pow(1.2,r-1)):0}
function xpNeed(){return Math.floor(50*Math.pow(1.35,S.level-1))}
function hero(){
 S.skills.LifeSteal=S.skills.LifeSteal||0;
 let h={hp:150+(S.level-1)*12+skillBonus("Vitality"),atk:10+(S.level-1)*.5+skillBonus("Strength"),armor:10+(S.level-1)*.4+skillBonus("Skin"),spd:1,crit:.05+skillBonus("Precision")/100,critDmg:1.5,ls:skillBonus("LifeSteal")/100,gold:1,soul:1};
 S.petsOwned=S.petsOwned||["hound"];S.equippedPet=S.equippedPet||"hound";S.charactersOwned=S.charactersOwned||["warrior"];S.activeCharacter=S.activeCharacter||"warrior";
 S.petsOwned.forEach(id=>{let p=petDefs[id];if(p)applyPetStat(h,p.perk)});
 let ep=petDefs[S.equippedPet];if(ep){applyPetStat(h,ep.active);applyPetStat(h,ep.affix)}
 Object.values(petSets).forEach(set=>{let n=set.members.filter(id=>S.petsOwned.includes(id)).length;set.tiers.forEach(t=>{if(n>=t.n)applyPetStat(h,t)})});
 S.charactersOwned.forEach(id=>{let c=characterDefs[id];if(c)applyPetStat(h,c.perk)});
 Object.values(characterSets).forEach(set=>{let n=set.members.filter(id=>S.charactersOwned.includes(id)).length;set.tiers.forEach(t=>{if(n>=t.n)applyPetStat(h,t)})});
 Object.values(S.gear).forEach(i=>{if(!i)return;let all=[];if(i.inherent)all.push(i.inherent);all.push(...(i.mods||[]));all.forEach(m=>{let v=m.v;if(m.k==="ATK")h.atk+=v;if(m.k==="HP")h.hp+=v;if(m.k==="Armor")h.armor+=v;if(m.k==="Crit")h.crit+=v/100;if(m.k==="CritDmg")h.critDmg+=v/100;if(m.k==="AttackSpeed")h.spd+=v/100;if(m.k==="LifeSteal")h.ls+=v/100;if(m.k==="GoldFind")h.gold+=v/100;if(m.k==="SoulFind")h.soul+=v/100})});
 let activeDef=characterDefs[S.activeCharacter]||characterDefs.warrior;
 if(activeDef.activeStat){
   let a=activeDef.activeStat;
   if(a.k==="ArmorPct")h.armor*=1+a.v/100;
   else if(a.k==="Crit")h.crit+=a.v;
   else if(a.k==="CritDmg")h.critDmg+=a.v;
   else if(a.k==="HPPct")h.hp*=1+a.v/100;
   else if(a.k==="AttackSpeed")h.speed*=1+a.v/100;
 }
return h}
function enemyFor(n){
 let boss=n%5===0, name, base;
 if(n<=4){name="Beggar";base=[30,3,0,.7,8,3,1]}
 else if(n===5){name="Beggar King";base=[220,8,4,.8,100,38,10]}
 else if(n<=9){name="Thief";base=[65,6,3,1.2,18,8,1]}
 else if(n===10){name="Cutpurse Captain";base=[420,13,8,1.1,180,65,15]}
 else if(n<=14){name="Bounty Hunter";base=[130,10,10,.9,35,15,2]}
 else if(n===15){name="Veteran Bounty Hunter";base=[720,19,15,1,280,100,22]}
 else if(n<=19){name="Bounty Hunter";base=[150,11,11,.9,38,17,2]}
 else {name="The Headsman";base=[1200,28,22,.85,450,165,34]}
 let f=n===5||n===10||n===15||n===20?1:Math.pow(1.075,n-1);
 return {name,boss,maxHp:Math.round(base[0]*f),hp:Math.round(base[0]*f),atk:base[1]*Math.pow(1.045,n-1),armor:base[2]*Math.pow(1.04,n-1),spd:base[3],xp:base[4],gold:base[5],souls:base[6],dead:false}
}
function spawn(){S.enemy=enemyFor(S.stage);S.hp=Math.min(S.hp||hero().hp,hero().hp);log("A "+S.enemy.name+" blocks the road.");render()}
function damage(atk,armor){return Math.max(1,atk*100/(100+armor))}
function strike(){if(!S.enemy||S.enemy.dead)return;let h=hero(),crit=Math.random()<h.crit,d=damage(h.atk,S.enemy.armor)*(crit?h.critDmg:1);hit(d,.02,crit);S.rage=Math.min(100,S.rage+5+(crit?2:0));enemyTurn()}
function cleave(){if(!S.enemy||S.enemy.dead||S.rage<25)return;S.rage-=25;hit(damage(hero().atk*1.75,S.enemy.armor),.05,false);enemyTurn()}
function hit(d,innate,crit){d=Math.min(S.enemy.hp,d);S.enemy.hp-=d;let heal=d*(innate+hero().ls);S.hp=Math.min(hero().hp,S.hp+heal);log((crit?"CRIT! ":"")+"You deal "+fmt(d)+" damage"+(heal>=.1?" and steal "+fmt(heal)+" HP.":"."));if(S.enemy.hp<=0)victory()}
function enemyTurn(){if(S.enemy.dead)return;let d=damage(S.enemy.atk,hero().armor);S.hp-=d;S.rage=Math.min(100,S.rage+1);if(S.hp<=0){S.hp=hero().hp;S.stage=S.checkpoint;spawn();log("Defeated. You return to Stage "+S.checkpoint+".")}render()}
function victory(){
 let e=S.enemy;
 const clearedStage=S.stage;
 const wasHighest=clearedStage===S.highest;
 e.dead=true;S.kills++;
 let h=hero(),g=Math.round(e.gold*h.gold*1.10),so=Math.max(0,Math.round(e.souls*1.32*h.soul*(1+skillBonus("SoulReaper")/100)));
 S.gold+=g;S.souls+=so;S.xp+=Math.round(e.xp*1.265);
 while(S.xp>=xpNeed()){S.xp-=xpNeed();S.level++;S.hp=hero().hp;log("Level up! You are now Level "+S.level+".")}
 if(Math.random()<(e.boss?1:.28))dropItem();
 if(e.boss){S.checkpoint=Math.min(20,clearedStage+1);if(Math.random()<.18)S.fate++;chooseBoon()}
 if(S.progress){
   if(wasHighest&&clearedStage<20){
     S.highest=clearedStage+1;
     S.stage=S.highest;
   }else if(clearedStage<S.highest){
     S.stage=Math.min(clearedStage+1,S.highest);
   }else{
     S.stage=clearedStage;
   }
 }else{
   S.stage=clearedStage;
 }
 log("Victory! +"+g+" Gold · +"+so+" Souls");
 render();save();
 if(!e.boss)setTimeout(()=>{spawn()},550);
}
function rollRarity(){let r=Math.random()*100,c=0;for(let x of rarities){c+=x[1];if(r<c)return x[0]}return"Legendary"}
function dropItem(){let slots=Object.keys(bases),slot=slots[Math.floor(Math.random()*slots.length)],rar=rollRarity(),idx=["Normal","Magic","Rare","Epic","Legendary"].indexOf(rar),name=bases[slot][Math.floor(Math.random()*bases[slot].length)],mods=[],count=Math.max(0,idx);for(let i=0;i<count;i++){let k=affixes[Math.floor(Math.random()*affixes.length)],v=+(1+Math.random()*(k==="HP"?15:k==="CritDmg"?12:5)).toFixed(1);mods.push({k,v})}let inherentMap={Weapon:{k:"ATK",v:+(2+S.level*.35).toFixed(1)},Helm:{k:"Armor",v:+(2+S.level*.30).toFixed(1)},Chest:{k:"HP",v:Math.round(12+S.level*2.5)},Gloves:{k:"Crit",v:+(1+S.level*.05).toFixed(1)},Boots:{k:"AttackSpeed",v:+(2+S.level*.12).toFixed(1)}},inherent=inherentMap[slot];let item={id:Date.now()+Math.random(),slot,name,rarity:rar,level:S.level,inherent,mods,aspect:rar==="Legendary"?aspects[Math.floor(Math.random()*aspects.length)]:null};S.inventory.push(item);log("Found "+rar+" "+name+"!")}
function salvageReward(i){let map={Normal:null,Magic:"Dust",Rare:"Crystals",Epic:"Shards",Legendary:"Cores",Mythic:"Cores"},m=map[i.rarity],g=2+i.level,q=m?Math.max(1,Math.floor(i.level/5)+1):0;S.gold+=g;if(m)S.materials[m]+=q;return {m,g,q}}
function equipDirect(id){let i=S.inventory.find(x=>x.id==id);if(!i)return;let old=S.gear[i.slot];S.gear[i.slot]=i;S.inventory=S.inventory.filter(x=>x.id!=id);if(old){let r=salvageReward(old);log("Auto-salvaged "+old.name+" for "+r.g+" Gold"+(r.m?" + "+r.q+" "+r.m:"")+".")}S.hp=Math.min(S.hp,hero().hp);render();save()}

function gearIcon(slot){return `<span class="gear-icon ${slot}" aria-label="${slot}"></span>`}
function itemDetails(i){
 if(!i)return '<div class="small">Nothing equipped</div>';
 return `<div class="item-title ${i.rarity}">${i.rarity} ${i.name}</div><div class="small">Level ${i.level} · ${i.slot}</div>`+
 (i.inherent?`<div class="inherent">◆ Base: +${i.inherent.v}${["Crit","CritDmg","AttackSpeed","GoldFind","SoulFind","LifeSteal"].includes(i.inherent.k)?"% ":" "}${i.inherent.k}</div>`:"")+
 (i.mods||[]).map(m=>`<div class="affix">+${m.v}${["Crit","CritDmg","AttackSpeed","GoldFind","SoulFind","LifeSteal"].includes(m.k)?"% ":" "}${m.k}</div>`).join("")+
 (i.aspect?`<div class="aspect">✦ ${i.aspect}</div>`:"");
}
function itemTotals(i){
 let o={ATK:0,HP:0,Armor:0,Crit:0,CritDmg:0,AttackSpeed:0,GoldFind:0,SoulFind:0,LifeSteal:0};
 if(i){if(i.inherent)o[i.inherent.k]=(o[i.inherent.k]||0)+i.inherent.v;(i.mods||[]).forEach(m=>o[m.k]=(o[m.k]||0)+m.v)}return o;
}
function compareDelta(newI,oldI){
 let a=itemTotals(newI),b=itemTotals(oldI),keys=Object.keys(a),rows=[];
 keys.forEach(k=>{let d=+(a[k]-b[k]).toFixed(1);if(d){let pct=["Crit","CritDmg","AttackSpeed","GoldFind","SoulFind","LifeSteal"].includes(k)?"%":"";rows.push(`<div class="${d>0?"delta-up":"delta-down"}">${d>0?"+":""}${d}${pct} ${k}</div>`)}});return rows.join("")||'<div class="small">No direct affix-stat change.</div>';
}
function requestEquip(id){
 let i=S.inventory.find(x=>x.id==id);if(!i)return;let old=S.gear[i.slot];
 modal.classList.remove("hidden");
 modalBody.innerHTML=`<h2>Compare ${i.slot}</h2><div class="compare-grid"><div class="compare-col ${old?old.rarity:"Normal"}"><h3>Currently Equipped</h3>${gearIcon(i.slot)}${itemDetails(old)}</div><div class="compare-col ${i.rarity}"><h3>New Item</h3>${gearIcon(i.slot)}${itemDetails(i)}<hr><div class="small"><b>Change if equipped</b></div>${compareDelta(i,old)}</div></div><div class="compare-actions"><button onclick="confirmEquip('${i.id}')">Equip + Salvage Old</button><button onclick="closeModal()">Cancel</button></div>`;
}
function confirmEquip(id){equipDirect(id);closeModal();render();save()}

function salvage(id){let i=S.inventory.find(x=>x.id==id);if(!i)return;salvageReward(i);S.inventory=S.inventory.filter(x=>x.id!=id);render();save()}
function skillTotal(k){
 let d=skillDefs[k],v=skillBonus(k);
 return `${fmt(v)} ${d.unit}`;
}
function skillCost(k){return Math.floor(skillDefs[k].cost*Math.pow(1.5,S.skills[k]))}function buySkill(k){let c=skillCost(k);if(S.souls<c)return;S.souls-=c;S.skills[k]++;render();save()}
function chooseBoon(){let picks=[...boonPool].sort(()=>Math.random()-.5).slice(0,3);document.getElementById("modal").classList.remove("hidden");document.getElementById("modalBody").innerHTML="<h2>Boss Boon</h2><p>Choose one temporary boon for this run.</p><div class=boons>"+picks.map((b,i)=>`<button onclick='takeBoon(${JSON.stringify(b)})'><b>${b[0]}</b><br>${b[1]}</button>`).join("")+"</div>"+(S.fate?`<button onclick="rerollBoon()">🔮 Reroll all (1 Fate)</button>`:"")}
function takeBoon(b){S.boons.push(b);closeModal();spawn();render();save()}function rerollBoon(){if(S.fate){S.fate--;chooseBoon()}}function closeModal(){document.getElementById("modal").classList.add("hidden")}
function jumpStage(n){n=Math.max(1,Math.min(S.highest,n));S.stage=n;spawn();save()}
function toggleAuto(){S.auto=!S.auto;render();save()}function toggleProgress(){
 S.progress=!S.progress;
 log(S.progress?"Progression active — victories advance the road.":"Farm Mode active — victories repeat this stage.");
 render();save();
}
function autoTick(){if(!S.started)return;if(S.enemy&&!S.enemy.dead){if(S.autoSkill&&S.level>=10&&S.rage>=25)cleave();else strike()}}
function prestigeReward(){if(S.level<20)return 0;return Math.max(1,Math.floor((S.highest-1)/5)+Math.floor((S.level-20)/3)+1)}
function prestige(){let r=prestigeReward();if(!r)return; if(!confirm("Prestige now for "+r+" Legacy Points? Stage progress and Boss Boons reset."))return;S.legacy+=r;S.prestiges++;S.started=false;S.stage=1;S.highest=1;S.checkpoint=1;S.boons=[];S.rage=0;S.progress=false;S.hp=hero().hp;spawn();save()}

function refreshPets(){
 S.petsOwned=S.petsOwned||["hound"];
 Object.keys(petDefs).forEach(id=>{let p=petDefs[id];if(S.highest>=p.unlock&&!S.petsOwned.includes(id))S.petsOwned.push(id)});
}
function refreshCharacters(){S.charactersOwned=S.charactersOwned||["warrior"];Object.keys(characterDefs).forEach(id=>{let c=characterDefs[id];if(S.highest>=c.unlock&&!S.charactersOwned.includes(id)){S.charactersOwned.push(id);log("New character unlocked: "+c.name+"!");}})}
function selectCharacter(id){if(!S.charactersOwned.includes(id))return;S.activeCharacter=id;S.hp=Math.min(S.hp,hero().hp);log(characterDefs[id].name+" is now your active character.");render();save()}
function beginJourney(){S.started=true;if(!S.enemy||S.enemy.dead)spawn();render();save()}
function toggleAutoSkill(){if(S.level<10){log("Auto Skill unlocks at Warrior Level 10.");return}S.autoSkill=!S.autoSkill;render();save()}

function equipPet(id){if(!S.petsOwned.includes(id))return;S.equippedPet=id;render();save()}
function petSprite(p){return `<div class="pet-sprite ${p.sprite}"><i class="tail"></i><i class="body"></i><i class="head"></i><i class="eye"></i></div>`}
function showPane(id){document.querySelectorAll(".pane").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.p===id))}
function itemHtml(i){return `<div class="item ${i.rarity}">${gearIcon(i.slot)}<b>${i.rarity} ${i.name}</b><div class=small>Lv ${i.level} · ${i.slot}</div>${i.inherent?`<div class=inherent>◆ Base: +${i.inherent.v}${["Crit","CritDmg","AttackSpeed","GoldFind","SoulFind","LifeSteal"].includes(i.inherent.k)?"% ":" "}${i.inherent.k}</div>`:""}${i.mods.map(m=>`<div class=small>+${m.v}${["Crit","CritDmg","AttackSpeed","GoldFind","SoulFind","LifeSteal"].includes(m.k)?"% ":" "}${m.k}</div>`).join("")}${i.aspect?`<div class=good>Aspect: ${i.aspect}</div>`:""}<button onclick="requestEquip('${i.id}')">Equip</button> <button onclick="salvage('${i.id}')">Salvage</button></div>`}
function render(){
 let h=hero(),e=S.enemy||enemyFor(S.stage);document.getElementById("version").textContent="v"+VERSION;gold.textContent=S.gold;souls.textContent=S.souls;fate.textContent=S.fate;legacy.textContent=S.legacy;
 stageTitle.textContent="Stage "+S.stage+" / 20 · Checkpoint "+S.checkpoint;
 encounterStage.textContent=" · Stage "+S.stage;
 modeChip.textContent=S.progress?"PROGRESSION":"FARM MODE";
 modeChip.classList.toggle("progression-on",S.progress);
 modeChip.classList.toggle("farm-on",!S.progress);stageRead.textContent="Stage "+S.stage+" / "+S.highest;let ac=characterDefs[S.activeCharacter]||characterDefs.warrior;
 heroName.textContent=ac.name+" · "+ac.rarity+" · Lv "+S.level;
 document.getElementById("heroPortrait").className="portrait heroPix "+(S.activeCharacter||"warrior");
 heroHp.textContent=fmt(Math.max(0,S.hp))+" / "+fmt(h.hp)+" HP";heroHpFill.style.width=Math.max(0,S.hp/h.hp*100)+"%";rage.textContent=S.rage+" / 100 Rage";rageFill.style.width=S.rage+"%";xp.textContent=S.xp+" / "+xpNeed()+" XP";xpFill.style.width=S.xp/xpNeed()*100+"%";
 heroStats.innerHTML=`<span class=stat>ATK ${fmt(h.atk)}</span><span class=stat>Armor ${fmt(h.armor)}</span><span class=stat>Speed ${fmt(h.spd)}</span><span class=stat>Crit ${fmt(h.crit*100)}%</span><span class=stat>Life Steal ${fmt(h.ls*100)}% + ability</span>`;
 enemyName.textContent=e.name;enemyHp.textContent=fmt(Math.max(0,e.hp))+" / "+fmt(e.maxHp)+" HP";enemyHpFill.style.width=Math.max(0,e.hp/e.maxHp*100)+"%";enemyStats.innerHTML=`<span class=stat>ATK ${fmt(e.atk)}</span><span class=stat>Armor ${fmt(e.armor)}</span><span class=stat>Speed ${e.spd}</span>`;
 let ep=document.getElementById("enemyPortrait"),l=e.name.toLowerCase();ep.className="portrait enemyPix "+(e.boss?"boss":(l.includes("thief")||l.includes("cutpurse")?"thief":(l.includes("bounty")||l.includes("headsman")?"bounty":"beggar")));
 cleaveBtn.disabled=!S.started||S.rage<25||e.dead;strikeBtn.disabled=!S.started;beginPanel.classList.toggle("show",!S.started);
 let asl=S.level>=10;skillAutoBtn.disabled=!asl;skillAutoBtn.textContent=asl?"Auto Skill: "+(S.autoSkill?"ON":"OFF"):"Auto Skill · Lv 10";skillAutoBtn.classList.toggle("on",asl&&S.autoSkill);skillAutoBtn.classList.toggle("locked-toggle",!asl);
 gear.innerHTML="<h3>Equipped Gear</h3><div class=grid>"+Object.keys(bases).map(k=>`<div class="item equipped-card ${S.gear[k]?S.gear[k].rarity:'Normal'}">${gearIcon(k)}<div><b>${k}</b>${itemDetails(S.gear[k])}</div></div>`).join("")+"</div><h3>Inventory ("+S.inventory.length+"/30)</h3><div class=grid>"+S.inventory.map(itemHtml).join("")+"</div><p class=resource>✨ Dust "+S.materials.Dust+" · 💎 Crystals "+S.materials.Crystals+" · 🔷 Shards "+S.materials.Shards+" · 🔥 Cores "+S.materials.Cores+"</p>";
 skills.innerHTML="<h3>Account Soul Tree</h3><p class=small>Upgrade buttons activate when you have enough Souls.</p>"+Object.keys(skillDefs).map(k=>{let cost=skillCost(k),can=S.souls>=cost,rank=S.skills[k]||0;return `<div class="item skill-card"><div><b>${skillDefs[k].label}</b><div class=skill-rank>Current Level: ${rank}</div><div class=small>Level 1 Base: +${fmt(skillDefs[k].base)} ${skillDefs[k].unit}</div><div class=small>Growth: +20% compounded per additional level</div><div class=skill-total>Total Bonus: +${skillTotal(k)}</div></div><div><button class="skill-buy ${can?"ready":"locked"}" onclick="buySkill('${k}')" ${can?"":"disabled"}>Upgrade</button><div class="skill-cost ${can?"canbuy":"cantbuy"}">${cost} Souls</div></div></div>`}).join("");
 boons.innerHTML="<h3>Current Boss Boons</h3>"+(S.boons.length?S.boons.map(b=>`<div class=item><b>${b[0]}</b><div>${b[1]}</div></div>`).join(""):"<p>No Boss Boons this run.</p>");
 refreshPets();refreshCharacters();
 let setHtml=Object.keys(petSets).map(sn=>{let set=petSets[sn],count=set.members.filter(id=>S.petsOwned.includes(id)).length;return `<div class=set-box><b>${sn} Set · ${count}/${set.members.length}</b>${set.tiers.map(t=>`<div class="${count>=t.n?"set-on":"set-off"}">${count>=t.n?"✓":"○"} ${t.n} owned: ${t.text}</div>`).join("")}</div>`}).join("");
 let charSetHtml=Object.keys(characterSets).map(sn=>{let set=characterSets[sn],count=set.members.filter(id=>S.charactersOwned.includes(id)).length;return `<div class=set-box><b>${sn} Characters · ${count}/${set.members.length}</b>${set.tiers.map(t=>`<div class="${count>=t.n?"set-on":"set-off"}">${count>=t.n?"✓":"○"} ${t.n} owned: ${t.text}</div>`).join("")}</div>`}).join("");
 pets.innerHTML=`<h3>Pet Collection</h3><div class=collection-summary><b>Collection rules</b><div class=small>Individual ownership perks and completed set bonuses are permanent. Your equipped pet additionally grants its Active Bonus and Pet Affix.</div></div><h3>Pet Sets</h3>${setHtml}<div class=grid>`+Object.keys(petDefs).map(id=>{let p=petDefs[id],owned=S.petsOwned.includes(id),eq=S.equippedPet===id;return `<div class="item pet-card ${p.rarity} ${owned?"":"pet-locked"}">${petSprite(p)}<div><b>${p.name}</b><div class=small>${p.type} · ${p.rarity}</div><div>${p.sets.map(x=>`<span class=set-chip>${x}</span>`).join("")}</div><div class=perk>Ownership: ${statText(p.perk)}</div><div class=good>Active: ${statText(p.active)}</div><div class=pet-affix>Affix: ${statText(p.affix)}</div>${owned?(eq?`<div class=pet-equipped>✓ Active Companion</div>`:`<button onclick="equipPet('${id}')">Equip Pet</button>`):`<div class=small>Discover after reaching Stage ${p.unlock}</div>`}</div></div>`}).join("")+`</div><h3>Character Collection</h3><div class=char-grid>${Object.keys(characterDefs).map(id=>{let c=characterDefs[id],owned=S.charactersOwned.includes(id);return `<div class="char-card rarity-${c.rarity} ${owned?"char-owned":"char-locked"}"><div class="char-portrait ${id}"><i class=head></i><i class=body></i><i class=legs></i></div><b>${c.name} · ${c.rarity}</b><div>${c.sets.map(x=>`<span class=set-chip>${x}</span>`).join("")}</div><div class=perk>Ownership: ${c.perkText} permanently</div><div class="active-perk">⚔ Active: ${c.activeText||"No active bonus"}</div><div class=unlock-note>${owned?"✓ Owned":`Unlock at Stage ${c.unlock}`}</div>${owned?(S.activeCharacter===id?`<div class=active-badge>★ ACTIVE CHARACTER</div>`:`<button class=char-select onclick="event.stopPropagation();selectCharacter('${id}')">Select</button>`):""}</div>`}).join("")}</div><h3>Character Sets</h3>${charSetHtml}`;


 characters.innerHTML=`<h3>Character Collection</h3>
 <p class=small>Select any unlocked hero. Ownership and set bonuses remain permanent.</p>
 <div class=char-grid>${Object.keys(characterDefs).map(id=>{let c=characterDefs[id],owned=S.charactersOwned.includes(id);return `<div class="char-card rarity-${c.rarity} ${owned?"char-owned":"char-locked"} ${S.activeCharacter===id?"active-char":""}"><div class="char-portrait ${id}"><i class=head></i><i class=body></i><i class=legs></i></div><b>${c.name} · ${c.rarity}</b><div>${c.sets.map(x=>`<span class=set-chip>${x}</span>`).join("")}</div><div class=perk>Ownership: ${c.perkText} permanently</div><div class=unlock-note>${owned?"✓ Owned":`Unlock at Stage ${c.unlock}`}</div>${owned?(S.activeCharacter===id?`<div class=active-badge>★ ACTIVE CHARACTER</div>`:`<button class=char-select onclick="selectCharacter('${id}')">Select Character</button>`):""}</div>`}).join("")}</div>
 <h3>Character Sets</h3>${charSetHtml}`;
 
 let petPane=document.getElementById("pets");
 let characterMarker=petPane.innerHTML.indexOf("<h3>Character Collection</h3>");
 if(characterMarker>=0)petPane.innerHTML=petPane.innerHTML.slice(0,characterMarker);

 let pr=prestigeReward();system.innerHTML=`<div class=sys><h3>Wanderer's Road v${VERSION}</h3><p>Highest Stage: ${S.highest} · Kills: ${S.kills} · Prestiges: ${S.prestiges}</p><p class=legacy>Legacy Points: ${S.legacy}</p><p>Prestige unlocks at <b>character Level 20</b>. It resets stage/checkpoint progress and Boss Boons while retaining levels, gear, inventory, Souls, skill upgrades, materials, Fate Tokens and Legacy Points.</p><button onclick="prestige()" ${S.level<20?"disabled":""}>Prestige${S.level>=20?" · Gain "+pr+" Legacy": " · Locked until Lv 20"}</button><button onclick="save()">Save</button><button onclick="resetGame()">Reset Save</button></div>`;
}
function log(x){document.getElementById("log").textContent=x}
function save(){localStorage.setItem(SAVE,JSON.stringify(S))}
function resetGame(){if(confirm("Delete the v4.4 save and restart?")){localStorage.removeItem(SAVE);S=fresh();spawn();save()}}
S.started=!!S.started;
S.autoSkill=!!S.autoSkill;
S.progress=S.progress===true;
S.charactersOwned=S.charactersOwned||["warrior"];
S.petsOwned=S.petsOwned||["hound"];
S.equippedPet=S.equippedPet||"hound";
if(!S.enemy)spawn();else render();setInterval(autoTick,900);setInterval(save,10000);
</script>
<script>
(function(){
 let deferredInstall=null;
 const btn=document.getElementById("installAppBtn");
 window.addEventListener("beforeinstallprompt",function(e){
   e.preventDefault(); deferredInstall=e;
   if(btn) btn.hidden=false;
 });
 if(btn) btn.addEventListener("click",async function(){
   if(!deferredInstall)return;
   deferredInstall.prompt();
   try{await deferredInstall.userChoice}catch(e){}
   deferredInstall=null; btn.hidden=true;
 });
 window.addEventListener("appinstalled",function(){if(btn)btn.hidden=true;});
 if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
   window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
 }
})();
</script>

<script>
function setSaveTransferStatus(msg,ok){
 const el=document.getElementById("saveTransferStatus");
 if(el){el.textContent=msg;el.classList.toggle("ok",!!ok);el.classList.toggle("bad",ok===false);}
}
function exportGameSave(){
 try{
   save();
   const payload={
     format:"WanderersRoadSave",
     formatVersion:1,
     gameVersion:typeof VERSION!=="undefined"?VERSION:"4.4",
     exportedAt:new Date().toISOString(),
     state:S
   };
   const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   const stamp=new Date().toISOString().replace(/[:.]/g,"-");
   a.href=url;a.download="Wanderers_Road_Save_"+stamp+".json";
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
   setSaveTransferStatus("Save exported successfully.",true);
 }catch(err){setSaveTransferStatus("Export failed: "+err.message,false);}
}
async function importGameSaveFile(file){
 if(!file)return;
 try{
   const text=await file.text();
   const payload=JSON.parse(text);
   if(!payload||payload.format!=="WanderersRoadSave"||payload.formatVersion!==1||!payload.state)
     throw new Error("This is not a valid Wanderer's Road save file.");
   const incoming=payload.state;
   if(typeof incoming!=="object"||incoming===null||!Number.isFinite(Number(incoming.stage))||!Number.isFinite(Number(incoming.level)))
     throw new Error("Save data is incomplete.");
   if(!confirm("Import this Wanderer's Road save? Your current save on this device will be replaced.")){
     setSaveTransferStatus("Import cancelled."); return;
   }
   localStorage.setItem(SAVE,JSON.stringify(incoming));
   setSaveTransferStatus("Save imported. Reloading game…",true);
   location.reload();
 }catch(err){setSaveTransferStatus("Import failed: "+err.message,false);}
}
</script>
